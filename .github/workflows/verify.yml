name: verify

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Point this at go.sum once the module has dependencies.
          cache-dependency-path: go.mod

      # Skips the golangci-lint build. The pinned version lives in the
      # Makefile, so bumping it invalidates the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      # Actions sets CI, so this skips the format stage. The linter reports
      # formatter differences as findings, and fails instead of rewriting.
      - run: make verify
